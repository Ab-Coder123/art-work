<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#12131d" />
      <stop offset="100%" stop-color="#181726" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="pdfRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(234, 179, 8, 0.05)" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <rect width="1200" height="750" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="280" fill="#EAB308" opacity="0.06" filter="url(#glow)" />
  <circle cx="1000" cy="600" r="320" fill="#F59E0B" opacity="0.04" filter="url(#glow)" />

  <!-- Frame Border -->
  <rect x="24" y="24" width="1152" height="702" rx="20" fill="none" stroke="rgba(234, 179, 8, 0.2)" stroke-width="2" />
  <rect x="32" y="32" width="1136" height="686" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" stroke-dasharray="6,6" />

  <!-- Technical Corner Marks -->
  <path d="M 44 64 L 44 44 L 64 44" fill="none" stroke="#EAB308" stroke-width="3" />
  <path d="M 1156 64 L 1156 44 L 1136 44" fill="none" stroke="#EAB308" stroke-width="3" />
  <path d="M 44 686 L 44 706 L 64 706" fill="none" stroke="#EAB308" stroke-width="3" />
  <path d="M 1156 686 L 1156 706 L 1136 706" fill="none" stroke="#EAB308" stroke-width="3" />

  <!-- Top Studio Header Ribbon -->
  <g transform="translate(64, 60)">
    <rect x="0" y="0" width="170" height="32" rx="8" fill="#EAB308" />
    <text x="85" y="21" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1.5">ART WORK STUDIO</text>
    
    <text x="190" y="22" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#EAB308" letter-spacing="2">DOC-SPEC // MERCH-CATALOG-2026</text>
  </g>

  <!-- Central Document Mockup Card (Tilted 3D Stack) -->
  <g transform="translate(700, 140)" filter="url(#shadow)">
    <!-- Back Sheet 2 -->
    <rect x="30" y="-15" width="380" height="490" rx="16" fill="#181926" stroke="rgba(234,179,8,0.25)" stroke-width="1.5" transform="rotate(6 220 230)" />
    <!-- Back Sheet 1 -->
    <rect x="15" y="-8" width="380" height="490" rx="16" fill="#141520" stroke="rgba(234,179,8,0.35)" stroke-width="1.5" transform="rotate(3 205 235)" />
    <!-- Main Top Document -->
    <rect x="0" y="0" width="380" height="490" rx="16" fill="#10111a" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Document Header Area -->
    <rect x="24" y="24" width="332" height="120" rx="10" fill="#181a28" />
    <circle cx="64" cy="64" r="24" fill="url(#goldGrad)" />
    <!-- Gift / Box Icon in Document -->
    <path d="M 52 64 L 76 64 M 64 52 L 64 76" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <rect x="54" y="58" width="20" height="16" rx="2" fill="none" stroke="#000000" stroke-width="2.5" />

    <text x="104" y="58" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">GIVEAWAYS &amp; GIFTS</text>
    <text x="104" y="76" font-family="'Courier New', monospace" font-size="10" fill="#EAB308">ITEM SPECS &amp; DIMENSIONS</text>
    <text x="104" y="92" font-family="'Courier New', monospace" font-size="9" fill="#9CA3AF">ALL ITEMS • 2026 EDITION</text>

    <!-- Document Wireframe Lines -->
    <line x1="24" y1="170" x2="356" y2="170" stroke="rgba(234,179,8,0.2)" stroke-width="1" stroke-dasharray="4,4" />
    
    <!-- Mini Catalog Grid Items inside Document -->
    <rect x="24" y="190" width="96" height="80" rx="8" fill="#181926" stroke="#26273b" stroke-width="1" />
    <circle cx="72" cy="225" r="16" fill="#EAB308" opacity="0.3" />
    <rect x="36" y="252" width="72" height="6" rx="3" fill="#6B7280" />

    <rect x="142" y="190" width="96" height="80" rx="8" fill="#181926" stroke="#26273b" stroke-width="1" />
    <rect x="166" y="213" width="48" height="24" rx="4" fill="#EAB308" opacity="0.3" />
    <rect x="154" y="252" width="72" height="6" rx="3" fill="#6B7280" />

    <rect x="260" y="190" width="96" height="80" rx="8" fill="#181926" stroke="#26273b" stroke-width="1" />
    <path d="M 308 210 L 320 230 L 296 230 Z" fill="#EAB308" opacity="0.3" />
    <rect x="272" y="252" width="72" height="6" rx="3" fill="#6B7280" />

    <!-- Bottom Page Wireframe Lines -->
    <rect x="24" y="295" width="220" height="10" rx="4" fill="#374151" />
    <rect x="24" y="315" width="310" height="8" rx="4" fill="#1F2937" />
    <rect x="24" y="330" width="280" height="8" rx="4" fill="#1F2937" />
    <rect x="24" y="345" width="190" height="8" rx="4" fill="#1F2937" />

    <!-- Bottom Stamp in Document -->
    <rect x="24" y="380" width="332" height="74" rx="8" fill="#171825" stroke="rgba(234,179,8,0.3)" stroke-width="1" />
    <text x="40" y="408" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#EAB308">HIGH-RES PRODUCTION SPECIFICATION</text>
    <text x="40" y="426" font-family="'Courier New', monospace" font-size="9" fill="#9CA3AF">VECTOR LOGO PRINTING • UV SPOT • EMBOSSING</text>
    <text x="40" y="442" font-family="'Courier New', monospace" font-size="9" fill="#EAB308">APPROVED FOR PRODUCTION // ART WORK</text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(74, 180)">
    <!-- Red PDF Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="42" rx="10" fill="url(#pdfRedGrad)" filter="url(#shadow)" />
      <path d="M 22 26 L 22 16 L 28 16 C 31 16 33 18 33 21 C 33 24 31 26 28 26 Z M 26 19 L 26 23 L 28 23 C 29.5 23 30 22 30 21 C 30 20 29.5 19 28 19 Z" fill="#FFFFFF" />
      <path d="M 40 16 L 46 16 C 51 16 54 19 54 23 C 54 27 51 30 46 30 L 40 30 Z M 44 19 L 44 27 L 46 27 C 49 27 50.5 25.5 50.5 23 C 50.5 20.5 49 19 46 19 Z" fill="#FFFFFF" />
      <path d="M 60 16 L 73 16 L 73 19.5 L 64.5 19.5 L 64.5 22.5 L 71.5 22.5 L 71.5 25.5 L 64.5 25.5 L 64.5 30 L 60 30 Z" fill="#FFFFFF" />
      <text x="86" y="26" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">CATALOG</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">PROMOTIONAL</text>
    <text x="0" y="170" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#goldGrad)" letter-spacing="-1">GIVEAWAYS</text>
    
    <!-- Subtitle -->
    <text x="0" y="225" font-family="'Arial', sans-serif" font-size="18" font-weight="700" fill="#E5E7EB" letter-spacing="1">CATALOG &amp; PRODUCTION SPEC SHEET</text>
    
    <!-- Description Paragraph -->
    <text x="0" y="270" font-family="'Courier New', monospace" font-size="13" fill="#9CA3AF" line-height="1.6">
      <tspan x="0" dy="0">Complete specifications, item dimensions, printing finishes,</tspan>
      <tspan x="0" dy="22">packaging options, and premium VIP executive gift sets.</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 335)">
      <!-- Badge 1: Vector Printable -->
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#181a28" stroke="rgba(234,179,8,0.4)" stroke-width="1.5" />
      <text x="82" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#FDE047" text-anchor="middle">✦ 100% VECTOR SPEC</text>

      <!-- Badge 2: Turnkey Gifting -->
      <rect x="180" y="0" width="180" height="36" rx="8" fill="#181a28" stroke="rgba(234,179,8,0.4)" stroke-width="1.5" />
      <text x="270" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#FDE047" text-anchor="middle">✦ TURNKEY LOGISTICS</text>

      <!-- Badge 3: 2026 Edition -->
      <rect x="375" y="0" width="130" height="36" rx="8" fill="url(#goldGrad)" />
      <text x="440" y="22" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle">2026 CATALOG</text>
    </g>

    <!-- PDF Attachment Indicator Card -->
    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="505" height="60" rx="12" fill="#13141f" stroke="#EAB308" stroke-width="1.5" />
      <circle cx="36" cy="30" r="16" fill="rgba(234,179,8,0.15)" />
      <!-- Download Arrow Icon -->
      <path d="M 36 20 L 36 34 M 30 28 L 36 34 L 42 28 M 28 38 L 44 38" fill="none" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="68" y="28" font-family="'Arial', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">OFFICIAL PDF CATALOG ATTACHED</text>
      <text x="68" y="46" font-family="'Courier New', monospace" font-size="11" fill="#EAB308">CLICK TO OPEN &amp; DOWNLOAD FULL SPECIFICATION SHEET</text>
    </g>
  </g>
</svg>
